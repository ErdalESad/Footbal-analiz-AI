name: Android APK Olustur

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Projeyi Hazirla ve APK Derle
        run: |
          flutter create app_build --project-name futbol_analiz_ai --platforms android
          if [ -f "Lib/main.dart" ]; then cp Lib/main.dart app_build/lib/main.dart; fi
          if [ -f "Lib/Main.dart" ]; then cp Lib/Main.dart app_build/lib/main.dart; fi
          if [ -f "lib/main.dart" ]; then cp lib/main.dart app_build/lib/main.dart; fi
          cd app_build
          flutter pub add http shared_preferences
          flutter build apk --release

      - name: APK Dosyasini Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: Futbol-Analiz-AI-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
