name: Android APK Olustur

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kur
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android Dosyalarini Tamamla ve Paketleri Yukle
        run: |
          flutter create . --project-name futbol_analiz_ai --platforms android
          flutter pub get

      - name: APK Derle
        run: flutter build apk --release

      - name: APK Dosyasini Hazirla
        uses: actions/upload-artifact@v4
        with:
          name: Futbol-Analiz-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
